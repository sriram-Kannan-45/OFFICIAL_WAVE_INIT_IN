<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle ambient decorative glow rings -->
  <circle cx="1050" cy="180" r="260" fill="#dcfce7" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="150" cy="500" r="220" fill="#f0fdf4" opacity="0.8" filter="url(#softGlow)"/>

  <!-- Geometric grid & connector lines -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.4">
    <line x1="800" y1="120" x2="1050" y2="180"/>
    <line x1="1050" y1="180" x2="1120" y2="340"/>
    <line x1="1050" y1="180" x2="950" y2="300"/>
    <line x1="950" y1="300" x2="880" y2="450"/>
  </g>
  <g fill="#16a34a" opacity="0.8">
    <circle cx="800" cy="120" r="5"/>
    <circle cx="1050" cy="180" r="8"/>
    <circle cx="1120" cy="340" r="6"/>
    <circle cx="950" cy="300" r="7"/>
    <circle cx="880" cy="450" r="5"/>
  </g>

  <!-- Content Container -->
  <g transform="translate(100, 100)">
    <!-- Studio Tag Badge -->
    <rect x="0" y="0" width="270" height="38" rx="19" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="4.5" fill="#16a34a"/>
    <text x="36" y="24" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#15803d" letter-spacing="1.2">AI PRODUCT STUDIO</text>

    <!-- Main Logo Display -->
    <text x="0" y="115" font-family="'Inter', sans-serif" font-weight="900" font-size="54" fill="#0f172a" letter-spacing="-1.5">WAVE <tspan fill="#16a34a">INIT</tspan></text>
    <text x="0" y="152" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#64748b" letter-spacing="3.5">SOLUTIONS</text>

    <!-- Main Headline -->
    <text x="0" y="240" font-family="'Inter', sans-serif" font-weight="800" font-size="44" fill="#0f172a" letter-spacing="-1">
      Build Smarter <tspan fill="#16a34a">Digital Products</tspan> with AI
    </text>

    <!-- Subtitle -->
    <text x="0" y="300" font-family="'Inter', sans-serif" font-weight="400" font-size="20" fill="#475569">
      Full-Stack Engineering · Generative AI Solutions · Autonomous Workflows
    </text>

    <!-- Pillar Badges -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="220" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="24" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#334155">AI Software Dev</text>

      <rect x="236" y="0" width="230" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="260" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#334155">Full Stack Platforms</text>

      <rect x="482" y="0" width="240" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <text x="506" y="26" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#334155">GenAI & Automation</text>
    </g>

    <!-- URL Indicator -->
    <text x="0" y="450" font-family="'Inter', sans-serif" font-weight="600" font-size="16" fill="#16a34a" letter-spacing="0.5">
      waveinitsolutions.com
    </text>
  </g>
</svg>
